<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">The problem in four facts</title><desc id="d">2.2 billion people live with a vision impairment (WHO). $26 a month buys 20 minutes of paid visual help in the US (Aira). At 3 a.m. nearby helpers are asleep, so help must come from another time zone. Sending $200 across borders costs 6.49% and often takes days (World Bank).</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#0F0F0F"/></marker></defs><rect x="1" y="1" width="898" height="358" rx="18" fill="#F6F4EF" stroke="#E4E1D8"/><text x="36" y="50" font-size="19" font-weight="700" fill="#0F0F0F" text-anchor="start">Visual help today is costly, local and hard to pay across borders.</text><rect x="36" y="78" width="405" height="118" rx="14" fill="#FFFFFF" stroke="#DFDDD6" stroke-width="1.5"/><circle cx="88" cy="137" r="27" fill="#FDDA24" stroke="#0F0F0F" stroke-width="2"/><path d="M72 137 Q88 122 104 137 Q88 152 72 137Z" fill="none" stroke="#0F0F0F" stroke-width="2.4" stroke-linecap="round"/><circle cx="88" cy="137" r="5" fill="#0F0F0F"/><text x="132" y="108" font-size="11" font-weight="700" fill="#5A5A5A" text-anchor="start" letter-spacing="1.5">NEED</text><text x="132" y="140" font-size="28" font-weight="800" fill="#0F0F0F" text-anchor="start">2.2 billion</text><text x="132" y="164" font-size="14" font-weight="400" fill="#2A2A2A" text-anchor="start">people live with a vision impairment</text><text x="132" y="183" font-size="12.5" font-weight="400" fill="#5A5A5A" text-anchor="start">World Health Organization, 2026</text><rect x="459" y="78" width="405" height="118" rx="14" fill="#FFFFFF" stroke="#DFDDD6" stroke-width="1.5"/><circle cx="511" cy="137" r="27" fill="#FDDA24" stroke="#0F0F0F" stroke-width="2"/><text x="511" y="146" font-size="26" font-weight="800" fill="#0F0F0F" text-anchor="middle">$</text><text x="555" y="108" font-size="11" font-weight="700" fill="#5A5A5A" text-anchor="start" letter-spacing="1.5">PRICE</text><text x="555" y="140" font-size="28" font-weight="800" fill="#0F0F0F" text-anchor="start">$26 a month</text><text x="555" y="164" font-size="14" font-weight="400" fill="#2A2A2A" text-anchor="start">buys 20 minutes of paid help in the US</text><text x="555" y="183" font-size="12.5" font-weight="400" fill="#5A5A5A" text-anchor="start">Aira's entry plan: about $1.30 a minute</text><rect x="36" y="212" width="405" height="118" rx="14" fill="#FFFFFF" stroke="#DFDDD6" stroke-width="1.5"/><circle cx="88" cy="271" r="27" fill="#FDDA24" stroke="#0F0F0F" stroke-width="2"/><circle cx="88" cy="271" r="13" fill="none" stroke="#0F0F0F" stroke-width="2.4" stroke-linecap="round"/><path d="M88 271 L88 263 M88 271 L94 275" fill="none" stroke="#0F0F0F" stroke-width="2.4" stroke-linecap="round"/><text x="132" y="242" font-size="11" font-weight="700" fill="#5A5A5A" text-anchor="start" letter-spacing="1.5">TIME</text><text x="132" y="274" font-size="28" font-weight="800" fill="#0F0F0F" text-anchor="start">At 3 a.m.</text><text x="132" y="298" font-size="14" font-weight="400" fill="#2A2A2A" text-anchor="start">the helpers near you are asleep</text><text x="132" y="317" font-size="12.5" font-weight="400" fill="#5A5A5A" text-anchor="start">so help must come from another time zone</text><rect x="459" y="212" width="405" height="118" rx="14" fill="#FFFFFF" stroke="#DFDDD6" stroke-width="1.5"/><circle cx="511" cy="271" r="27" fill="#FDDA24" stroke="#0F0F0F" stroke-width="2"/><circle cx="511" cy="271" r="13" fill="none" stroke="#0F0F0F" stroke-width="2.4" stroke-linecap="round"/><ellipse cx="511" cy="271" rx="6" ry="13" fill="none" stroke="#0F0F0F" stroke-width="2.4" stroke-linecap="round"/><path d="M498 271 L524 271" fill="none" stroke="#0F0F0F" stroke-width="2.4" stroke-linecap="round"/><text x="555" y="242" font-size="11" font-weight="700" fill="#5A5A5A" text-anchor="start" letter-spacing="1.5">RAILS</text><text x="555" y="274" font-size="28" font-weight="800" fill="#0F0F0F" text-anchor="start">6.49%</text><text x="555" y="298" font-size="14" font-weight="400" fill="#2A2A2A" text-anchor="start">to send $200 across borders</text><text x="555" y="317" font-size="12.5" font-weight="400" fill="#5A5A5A" text-anchor="start">and it often takes days (World Bank, 2025)</text></svg>