<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">The market: two sides and the price of a minute</title><desc id="d">People who need eyes pay only the seconds used; Stelleye matches, locks and settles on Stellar and earns 5% of each payout; sighted guides anywhere are paid in USDC in seconds. Paid help in the US costs about $1.30 a minute; a Stelleye guide in the demo charges 0.20 USDC.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#0F0F0F"/></marker></defs><rect x="1" y="1" width="898" height="348" rx="18" fill="#F6F4EF" stroke="#E4E1D8"/><text x="36" y="50" font-size="19" font-weight="700" fill="#0F0F0F" text-anchor="start">Two sides: people who need eyes, people who lend them.</text><rect x="36" y="78" width="250" height="92" rx="14" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.8"/><text x="161" y="107" font-size="16" font-weight="800" fill="#0F0F0F" text-anchor="middle">People who need eyes</text><text x="161" y="130" font-size="13" font-weight="400" fill="#2A2A2A" text-anchor="middle">visually impaired people</text><text x="161" y="150" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="middle">pay only the seconds used</text><rect x="325" y="78" width="250" height="92" rx="14" fill="#FDDA24" stroke="#0F0F0F" stroke-width="1.8"/><text x="450" y="107" font-size="16" font-weight="800" fill="#0F0F0F" text-anchor="middle">Stelleye on Stellar</text><text x="450" y="130" font-size="13" font-weight="400" fill="#2A2A2A" text-anchor="middle">matches, locks, settles</text><text x="450" y="150" font-size="13" font-weight="400" fill="#2A2A2A" text-anchor="middle">earns 5% of each payout</text><rect x="614" y="78" width="250" height="92" rx="14" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.8"/><text x="739" y="107" font-size="16" font-weight="800" fill="#0F0F0F" text-anchor="middle">People who lend them</text><text x="739" y="130" font-size="13" font-weight="400" fill="#2A2A2A" text-anchor="middle">sighted guides anywhere</text><text x="739" y="150" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="middle">paid in USDC in seconds</text><path d="M286 124 L322 124" stroke="#0F0F0F" stroke-width="2" marker-end="url(#ar)"/><path d="M575 124 L611 124" stroke="#0F0F0F" stroke-width="2" marker-end="url(#ar)"/><text x="36" y="214" font-size="15" font-weight="800" fill="#0F0F0F" text-anchor="start">The price of a minute of help</text><text x="36" y="248" font-size="14" font-weight="700" fill="#0F0F0F" text-anchor="start">Paid help in the US today</text><text x="36" y="266" font-size="12" font-weight="400" fill="#5A5A5A" text-anchor="start">$26 a month for 20 minutes (Aira)</text><rect x="330" y="234" width="440" height="30" rx="6" fill="#BDB9AE"/><text x="782" y="255" font-size="16" font-weight="800" fill="#0F0F0F" text-anchor="start">$1.30</text><text x="36" y="306" font-size="14" font-weight="700" fill="#0F0F0F" text-anchor="start">A Stelleye guide (demo rate)</text><text x="36" y="324" font-size="12" font-weight="400" fill="#5A5A5A" text-anchor="start">billed by the second; guides set their own</text><rect x="330" y="292" width="68" height="30" rx="6" fill="#FDDA24" stroke="#0F0F0F" stroke-width="1.5"/><text x="410" y="313" font-size="16" font-weight="800" fill="#0F0F0F" text-anchor="start">0.20 USDC</text></svg>