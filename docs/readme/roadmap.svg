<svg xmlns="http://www.w3.org/2000/svg" width="900" height="322" viewBox="0 0 900 322" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">The roadmap in four stops</title><desc id="d">Now: human guides on WhatsApp, per-second billing and instant payout on Stellar. Next: Face ID passkey wallets and sponsored fees. Then: USDC top-ups from other chains (CCTP) and mainnet with a licensed anchor. Vision: a fully automatic 3D understanding and navigation visual harness that pays per request.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#0F0F0F"/></marker></defs><rect x="1" y="1" width="898" height="320" rx="18" fill="#F6F4EF" stroke="#E4E1D8"/><text x="36" y="50" font-size="19" font-weight="700" fill="#0F0F0F" text-anchor="start">From human guides to a fully automatic service.</text><path d="M130 132 L770 132" stroke="#0F0F0F" stroke-width="3" stroke-dasharray="9 7"/><rect x="103.0" y="76" width="54" height="24" rx="12" fill="#0F0F0F" stroke="#0F0F0F" stroke-width="1.5"/><text x="130" y="92.5" font-size="12" font-weight="700" fill="#FDDA24" text-anchor="middle">Today</text><circle cx="130" cy="132" r="27" fill="#FDDA24" stroke="#0F0F0F" stroke-width="3"/><text x="130" y="137.5" font-size="15" font-weight="800" fill="#0F0F0F" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">01</text><text x="130" y="190" font-size="17" font-weight="800" fill="#0F0F0F" text-anchor="middle">Now · v1</text><text x="130" y="212" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="middle">Human guides on WhatsApp,</text><text x="130" y="230" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="middle">per-second billing and</text><text x="130" y="248" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="middle">instant payout on Stellar</text><rect x="320.0" y="76" width="46" height="24" rx="12" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.5"/><text x="343" y="92.5" font-size="12" font-weight="700" fill="#0F0F0F" text-anchor="middle">Next</text><circle cx="343" cy="132" r="27" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/><text x="343" y="137.5" font-size="15" font-weight="800" fill="#0F0F0F" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">02</text><text x="343" y="190" font-size="17" font-weight="800" fill="#0F0F0F" text-anchor="middle">Passkeys</text><text x="343" y="212" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="middle">Face ID passkey wallets</text><text x="343" y="230" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="middle">and sponsored fees:</text><text x="343" y="248" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="middle">no passwords, no XLM</text><rect x="533.0" y="76" width="46" height="24" rx="12" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.5"/><text x="556" y="92.5" font-size="12" font-weight="700" fill="#0F0F0F" text-anchor="middle">Then</text><circle cx="556" cy="132" r="27" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/><text x="556" y="137.5" font-size="15" font-weight="800" fill="#0F0F0F" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">03</text><text x="556" y="190" font-size="17" font-weight="800" fill="#0F0F0F" text-anchor="middle">Global rails</text><text x="556" y="212" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="middle">USDC top-ups from other</text><text x="556" y="230" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="middle">chains (CCTP), mainnet</text><text x="556" y="248" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="middle">with a licensed anchor</text><rect x="739.0" y="76" width="62" height="24" rx="12" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.5"/><text x="770" y="92.5" font-size="12" font-weight="700" fill="#0F0F0F" text-anchor="middle">Vision</text><circle cx="770" cy="132" r="27" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="3"/><text x="770" y="137.5" font-size="15" font-weight="800" fill="#0F0F0F" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">04</text><text x="770" y="190" font-size="17" font-weight="800" fill="#0F0F0F" text-anchor="middle">Fully automatic</text><text x="770" y="212" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="middle">A 3D understanding and</text><text x="770" y="230" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="middle">navigation visual harness</text><text x="770" y="248" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="middle">that pays per request</text><text x="450" y="294" font-size="14" fill="#2A2A2A" text-anchor="middle"><tspan font-weight="800" fill="#0F0F0F">Vision:</tspan> eyes on call for everyone, any hour, paid fairly; first with people, then fully automatic.</text></svg>