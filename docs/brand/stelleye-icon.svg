<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Stelleye"><title>Stelleye</title>
  <!-- Stelleye: an eye whose iris is a small planet with a gold orbit, a nod to Stellar's star-and-orbit
     feel (an original mark, not Stellar's logo); the catchlight is a star. -->
  <defs><linearGradient id="si-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0369a1"/><stop offset="1" stop-color="#0c4a6e"/></linearGradient></defs>
  <rect width="64" height="64" rx="15" fill="url(#si-bg)"/>
  <defs><radialGradient id="si-iris" cx="0.38" cy="0.35" r="0.75"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#0284c7"/></radialGradient></defs>
  <path d="M8.5 32 C17.5 17 46.5 17 55.5 32 C46.5 47 17.5 47 8.5 32 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <path d="M16.02 37.19 A16.8 5.4 -18 0 1 47.98 26.81" fill="none" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>
  <circle cx="32" cy="32" r="10.2" fill="url(#si-iris)"/>
  <circle cx="32" cy="32" r="4.4" fill="#062033"/>
  <path d="M47.98 26.81 A16.8 5.4 -18 0 1 16.02 37.19" fill="none" stroke="#fbbf24" stroke-width="2.9" stroke-linecap="round"/>
  <path d="M28.2 24.5 Q28.2 27.6 31.3 27.6 Q28.2 27.6 28.2 30.7 Q28.2 27.6 25.1 27.6 Q28.2 27.6 28.2 24.5 Z" fill="#ffffff"/>
