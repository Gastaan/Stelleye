<svg xmlns="http://www.w3.org/2000/svg" width="900" height="304" viewBox="0 0 900 304" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">The solution in five stops</title><desc id="d">Match: tap Get help and a verified guide accepts, live. Lock: the budget is locked in USDC on Stellar. Call: the guide video calls you on WhatsApp. Settle: exact seconds billed, the rest comes back. Pay: the guide is paid the moment it ends.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#0F0F0F"/></marker></defs><rect x="1" y="1" width="898" height="302" rx="18" fill="#F6F4EF" stroke="#E4E1D8"/><text x="36" y="50" font-size="19" font-weight="700" fill="#0F0F0F" text-anchor="start">Live help from a verified sighted guide, paid by the second.</text><path d="M110 132 L790 132" stroke="#0F0F0F" stroke-width="4"/><rect x="87.0" y="76" width="46" height="24" rx="12" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.5"/><text x="110" y="92.5" font-size="12" font-weight="700" fill="#0F0F0F" text-anchor="middle">Live</text><circle cx="110" cy="132" r="27" fill="#FDDA24" stroke="#0F0F0F" stroke-width="3"/><text x="110" y="137.5" font-size="15" font-weight="800" fill="#0F0F0F" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace">01</text><text x="110" y="190" font-size="18" font-weight="800" fill="#0F0F0F" text-anchor="middle">Match</text><text x="110" y="212" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="middle">Tap Get help;</text><text x="110" y="230" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="middle">a verified guide accepts</text><rect x="245.0" y="76" width="70" height="24" rx="12" fill="#0F0F0F" stroke="#0F0F0F" stroke-width="1.5"/><text x="280" y="92.5" font-size="12" font-weight="700" fill="#FDDA24" text-anchor="middle">Stellar</text><circle cx="280" cy="132" r="27" fill="#FDD