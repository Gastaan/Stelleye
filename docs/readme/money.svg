<svg xmlns="http://www.w3.org/2000/svg" width="900" height="316" viewBox="0 0 900 316" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">How the money moves</title><desc id="d">A 45-second call at 0.20 USDC a minute: open() locks 3.00 USDC in the CallEscrow contract; close() bills 0.15 USDC from ledger time and refunds 2.85 USDC to Maria; confirm() pays Ana 0.1425 USDC, the 0.15 earned minus the 5% platform fee.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9z" fill="#0F0F0F"/></marker></defs><rect x="1" y="1" width="898" height="314" rx="18" fill="#F6F4EF" stroke="#E4E1D8"/><text x="36" y="50" font-size="19" font-weight="700" fill="#0F0F0F" text-anchor="start">How the money moves: a 45-second call at 0.20 USDC a minute</text><rect x="36" y="96" width="220" height="104" rx="14" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.8"/><text x="146" y="134" font-size="17" font-weight="800" fill="#0F0F0F" text-anchor="middle">Maria's wallet</text><text x="146" y="157" font-size="13" font-weight="400" fill="#2A2A2A" text-anchor="middle">the caller</text><text x="146" y="176" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="middle">USDC</text><rect x="340" y="96" width="220" height="104" rx="14" fill="#FDDA24" stroke="#0F0F0F" stroke-width="1.8"/><text x="450" y="134" font-size="17" font-weight="800" fill="#0F0F0F" text-anchor="middle">CallEscrow</text><text x="450" y="157" font-size="13" font-weight="400" fill="#2A2A2A" text-anchor="middle">Soroban contract</text><text x="450" y="176" font-size="13" font-weight="400" fill="#2A2A2A" text-anchor="middle">reads Stellar's clock</text><rect x="644" y="96" width="220" height="104" rx="14" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.8"/><text x="754" y="134" font-size="17" font-weight="800" fill="#0F0F0F" text-anchor="middle">Ana's wallet</text><text x="754" y="157" font-size="13" font-weight="400" fill="#2A2A2A" text-anchor="middle">the guide</text><text x="754" y="176" font-size="13" font-weight="400" fill="#5A5A5A" text-anchor="middle">anywhere in the world</text><path d="M256 126 L337 126" stroke="#0F0F0F" stroke-width="2" marker-end="url(#ar)"/><circle cx="296" cy="126" r="12" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.8"/><text x="296" y="130.5" font-size="13" font-weight="800" fill="#0F0F0F" text-anchor="middle">1</text><path d="M340 172 L259 172" stroke="#0F0F0F" stroke-width="2" marker-end="url(#ar)"/><circle cx="299" cy="172" r="12" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.8"/><text x="299" y="176.5" font-size="13" font-weight="800" fill="#0F0F0F" text-anchor="middle">2</text><path d="M560 148 L641 148" stroke="#0F0F0F" stroke-width="2" marker-end="url(#ar)"/><circle cx="600" cy="148" r="12" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.8"/><text x="600" y="152.5" font-size="13" font-weight="800" fill="#0F0F0F" text-anchor="middle">3</text><circle cx="52" cy="235" r="12" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.8"/><text x="52" y="239.5" font-size="13" font-weight="800" fill="#0F0F0F" text-anchor="middle">1</text><text x="74" y="240" font-size="14" fill="#2A2A2A"><tspan font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="700" fill="#0F0F0F">open()</tspan> locks the budget: 3.00 USDC</text><circle cx="52" cy="263" r="12" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.8"/><text x="52" y="267.5" font-size="13" font-weight="800" fill="#0F0F0F" text-anchor="middle">2</text><text x="74" y="268" font-size="14" fill="#2A2A2A"><tspan font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="700" fill="#0F0F0F">close()</tspan> bills 45 s × 0.20 ÷ 60 = 0.15 USDC from ledger time, and refunds 2.85 USDC at once</text><circle cx="52" cy="291" r="12" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.8"/><text x="52" y="295.5" font-size="13" font-weight="800" fill="#0F0F0F" text-anchor="middle">3</text><text x="74" y="296" font-size="14" fill="#2A2A2A"><tspan font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="700" fill="#0F0F0F">confirm()</tspan> pays Ana 0.1425 USDC: the 0.15 earned, minus the 5% platform fee</text></svg>