<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Stelleye architecture</title><desc id="d">The Stelleye web app talks to Django and Channels on Modal over a live WebSocket and HTTPS, and opens WhatsApp for the video call. Django keeps SQLite saved to a Modal Volume, calls the CallEscrow Soroban contract, which holds Circle USDC, and uses a Stellar anchor (SEP-10 and SEP-24) to add money and cash out.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#0F0F0F"/></marker></defs><rect x="1" y="1" width="898" height="328" rx="18" fill="#F6F4EF" stroke="#E4E1D8"/><text x="36" y="50" font-size="19" font-weight="700" fill="#0F0F0F" text-anchor="start">Under the hood: three moving parts</text><rect x="30" y="70" width="250" height="236" rx="16" fill="none" stroke="#B9B5AA" stroke-dasharray="6 5" stroke-width="1.4"/><text x="155" y="94" font-size="13" font-weight="800" fill="#5A5A5A" text-anchor="middle">CALLER AND GUIDE</text><rect x="325" y="70" width="250" height="236" rx="16" fill="none" stroke="#B9B5AA" stroke-dasharray="6 5" stroke-width="1.4"/><text x="450" y="94" font-size="13" font-weight="800" fill="#5A5A5A" text-anchor="middle">MODAL: ONE WARM CONTAINER</text><rect x="620" y="70" width="250" height="236" rx="16" fill="none" stroke="#B9B5AA" stroke-dasharray="6 5" stroke-width="1.4"/><text x="745" y="94" font-size="13" font-weight="800" fill="#5A5A5A" text-anchor="middle">STELLAR</text><rect x="50" y="112" width="210" height="70" rx="12" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.6"/><text x="155.0" y="144.0" font-size="15" font-weight="800" fill="#0F0F0F" text-anchor="middle">Stelleye web app</text><text x="155.0" y="163.0" font-size="12.5" font-weight="400" fill="#5A5A5A" text-anchor="middle">screen-reader first</text><rect x="50" y="214" width="210" height="70" rx="12" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.6"/><text x="155.0" y="246.0" font-size="15" font-weight="800" fill="#0F0F0F" text-anchor="middle">WhatsApp video</text><text x="155.0" y="265.0" font-size="12.5" font-weight="400" fill="#5A5A5A" text-anchor="middle">the guide calls you</text><rect x="345" y="112" width="210" height="70" rx="12" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.6"/><text x="450.0" y="144.0" font-size="15" font-weight="800" fill="#0F0F0F" text-anchor="middle">Django + Channels</text><text x="450.0" y="163.0" font-size="12.5" font-weight="400" fill="#5A5A5A" text-anchor="middle">pages, API, live WebSocket</text><rect x="345" y="214" width="210" height="70" rx="12" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.6"/><text x="450.0" y="246.0" font-size="15" font-weight="800" fill="#0F0F0F" text-anchor="middle">SQLite</text><text x="450.0" y="265.0" font-size="12.5" font-weight="400" fill="#5A5A5A" text-anchor="middle">saved to a Modal Volume</text><rect x="640" y="106" width="210" height="56" rx="12" fill="#FDDA24" stroke="#0F0F0F" stroke-width="1.6"/><text x="745.0" y="131.0" font-size="15" font-weight="800" fill="#0F0F0F" text-anchor="middle">CallEscrow</text><text x="745.0" y="150.0" font-size="12.5" font-weight="400" fill="#2A2A2A" text-anchor="middle">Soroban contract</text><rect x="640" y="172" width="210" height="56" rx="12" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.6"/><text x="745.0" y="197.0" font-size="15" font-weight="800" fill="#0F0F0F" text-anchor="middle">Circle USDC</text><text x="745.0" y="216.0" font-size="12.5" font-weight="400" fill="#5A5A5A" text-anchor="middle">Stellar Asset Contract</text><rect x="640" y="238" width="210" height="56" rx="12" fill="#FFFFFF" stroke="#0F0F0F" stroke-width="1.6"/><text x="745.0" y="263.0" font-size="15" font-weight="800" fill="#0F0F0F" text-anchor="middle">Stellar anchor</text><text x="745.0" y="282.0" font-size="12.5" font-weight="400" fill="#5A5A5A" text-anchor="middle">SEP-10 and SEP-24</text><path d="M262 140 L342 140" stroke="#0F0F0F" stroke-width="2" fill="none" marker-end="url(#ar)" marker-start="url(#ar)"/><path d="M155 184 L155 211" stroke="#0F0F0F" stroke-width="2" fill="none" marker-end="url(#ar)" stroke-dasharray="4 3"/><path d="M450 184 L450 211" stroke="#0F0F0F" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M557 128 L637 128" stroke="#0F0F0F" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M557 162 L598 162 L598 266 L637 266" stroke="#0F0F0F" stroke-width="2" fill="none" marker-end="url(#ar)"/><path d="M745 164 L745 170" stroke="#0F0F0F" stroke-width="2"/></svg>